name: Deploy ECS Backend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to EC2 (SSH)
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-client

          mkdir -p ~/.ssh
          if [ -n "${KEY_B64:-}" ]; then
            printf '%s' "$KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes"

          ssh $SSH_OPTS "$USERNAME@$HOST" bash -s <<'EOF'
          set -euo pipefail

          echo "--- Backend: pull + npm i + pm2 restart"
          cd "/root/ECS0-Project"
          ENV_BAK="/tmp/ecs0_backend_env_$$.bak"
          if [ -f .env ]; then cp .env "$ENV_BAK"; fi

          git fetch origin
          git checkout master
          git reset --hard origin/master
          git clean -fd

          if [ -f "$ENV_BAK" ]; then mv "$ENV_BAK" .env; fi
          npm i
          pm2 restart 0
          pm2 save || true

          BACKEND_PORT="$( (grep -E '^PORT=' .env || true) | tail -n 1 | cut -d= -f2 )"
          BACKEND_PORT="${BACKEND_PORT:-8080}"

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${BACKEND_PORT}/api/health" >/dev/null; then ok=1; break; fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Backend health check failed on http://127.0.0.1:${BACKEND_PORT}/api/health"
            pm2 status || true
            pm2 logs --lines 100 --nostream || true
            exit 1
          fi

          echo "--- Backend deploy healthy"
          EOF
