name: Deploy ECS Backend

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to EC2 (SSH)
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

          mkdir -p ~/.ssh
          # Prefer base64 secret to avoid newline/formatting issues.
          if [ -n "${KEY_B64:-}" ]; then
            printf '%s' "$KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          # Validate key can be parsed (fails fast with clear error)
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$USERNAME@$HOST" "sudo -i bash -lc 'cd /root/ECS0-Project/ && git pull && rm -rf node_modules && npm i && pm2 restart 0'"
