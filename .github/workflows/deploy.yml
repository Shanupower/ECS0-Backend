name: Deploy ECS Backend

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to EC2 (SSH)
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

          mkdir -p ~/.ssh
          echo "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USERNAME@$HOST" "sudo -i bash -lc 'cd /root/ECS0-Project/ && git pull && rm -rf node_modules && npm i && pm2 restart 0'"
